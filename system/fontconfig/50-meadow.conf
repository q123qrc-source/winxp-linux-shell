<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SPDX-License-Identifier: GPL-3.0-or-later
     Maps the classic UI font names that Meadow's theme and older applications
     ask for onto open fonts with close metrics. If the user owns and installs
     the original fonts, fontconfig finds the real family first and these
     aliases never apply. Arial, Times New Roman and Courier New are already
     covered by the distribution's metric aliases (Liberation fonts).

     Not enabled system-wide: meadow-session points FONTCONFIG_FILE at
     /usr/share/meadow/fontconfig/fonts.conf, which loads the system
     configuration and then this file, so the aliases apply inside Meadow
     sessions only. -->
<fontconfig>
  <alias binding="same">
    <family>Tahoma</family>
    <accept><family>Noto Sans</family><family>DejaVu Sans</family><family>Liberation Sans</family></accept>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>Verdana</family>
    <accept><family>Noto Sans</family><family>DejaVu Sans</family><family>Liberation Sans</family></accept>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>Microsoft Sans Serif</family>
    <accept><family>Noto Sans</family><family>DejaVu Sans</family><family>Liberation Sans</family></accept>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>MS Sans Serif</family>
    <accept><family>Noto Sans</family><family>DejaVu Sans</family><family>Liberation Sans</family></accept>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>MS Shell Dlg</family>
    <accept><family>Noto Sans</family><family>DejaVu Sans</family><family>Liberation Sans</family></accept>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>MS Shell Dlg 2</family>
    <accept><family>Noto Sans</family><family>DejaVu Sans</family><family>Liberation Sans</family></accept>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>Trebuchet MS</family>
    <accept><family>Noto Sans</family><family>DejaVu Sans</family><family>Liberation Sans</family></accept>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>Franklin Gothic Medium</family>
    <accept><family>Noto Sans</family><family>DejaVu Sans</family><family>Liberation Sans</family></accept>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>Segoe UI</family>
    <accept><family>Noto Sans</family><family>DejaVu Sans</family><family>Liberation Sans</family></accept>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>Lucida Console</family>
    <accept><family>Noto Sans Mono</family><family>DejaVu Sans Mono</family><family>Liberation Mono</family></accept>
    <default><family>monospace</family></default>
  </alias>
  <alias binding="same">
    <family>Lucida Sans Typewriter</family>
    <accept><family>Noto Sans Mono</family><family>DejaVu Sans Mono</family><family>Liberation Mono</family></accept>
    <default><family>monospace</family></default>
  </alias>
  <alias binding="same">
    <family>Palatino Linotype</family>
    <accept><family>Noto Serif</family><family>DejaVu Serif</family><family>Liberation Serif</family></accept>
    <default><family>serif</family></default>
  </alias>
  <alias binding="same">
    <family>Book Antiqua</family>
    <accept><family>Noto Serif</family><family>DejaVu Serif</family><family>Liberation Serif</family></accept>
    <default><family>serif</family></default>
  </alias>
</fontconfig>
