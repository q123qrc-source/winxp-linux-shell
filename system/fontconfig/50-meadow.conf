<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SPDX-License-Identifier: GPL-3.0-or-later
     Maps the classic UI font names Meadow's theme asks for onto open fonts with
     close metrics. If the user owns and installs the original fonts, fontconfig
     finds the real family first and these aliases never apply. -->
<fontconfig>
  <alias binding="same">
    <family>Tahoma</family>
    <accept><family>Noto Sans</family><family>DejaVu Sans</family><family>Liberation Sans</family></accept>
  </alias>
  <alias binding="same">
    <family>Trebuchet MS</family>
    <accept><family>Noto Sans</family><family>DejaVu Sans</family><family>Liberation Sans</family></accept>
  </alias>
  <alias binding="same">
    <family>Franklin Gothic Medium</family>
    <accept><family>Noto Sans</family><family>DejaVu Sans</family><family>Liberation Sans</family></accept>
  </alias>
</fontconfig>
