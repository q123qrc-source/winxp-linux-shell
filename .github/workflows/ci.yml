name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  fedora:
    name: Fedora ${{ matrix.release }} build + tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: [latest, rawhide]
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.release }}
    steps:
      - name: Install git
        run: dnf -y install git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          dnf -y install dnf-plugins-core rpm-build rpmlint desktop-file-utils google-noto-sans-fonts fontconfig sddm qt6-qtsvg labwc grim wlr-randr xorg-x11-server-Xwayland dbus-daemon python3-dbus python3-gobject-base glib2 wtype
          dnf -y builddep packaging/fedora/meadow.spec
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build
      - name: Unit, schema, lint, asset-policy and QML smoke tests
        run: ctest --test-dir build --output-on-failure --label-exclude 'screenshot|perf'
      - name: Screenshot tests (tests/golden)
        if: matrix.release == 'latest'
        run: python3 tools/screenshot-test.py --build-dir build
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.release }}
          path: build/screenshots/
      - name: Validate desktop and metadata files
        run: tools/validate-session-desktop.sh session/meadow.desktop
      - name: RPM build and rpmlint
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/make-tarball.sh
          rpmbuild -ba packaging/fedora/meadow.spec --define "_sourcedir $PWD"
          rpmlint -r packaging/fedora/meadow.rpmlintrc packaging/fedora/meadow.spec ~/rpmbuild/RPMS/*/*.rpm
      # The shell's layer-shell surfaces in headless labwc are covered by
      # test_toplevel_labwc (ctest) and the shell-session-* goldens.
