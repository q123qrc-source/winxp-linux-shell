# Meadow shell defaults (/usr/share/meadow/shell.conf). Per-user changes go to
# ~/.config/meadow/shell.conf; this file is never written.
[Taskbar]
locked=true
autoHide=false
groupButtons=true
showQuickLaunch=true
showClock=true
hideInactiveIcons=true
# Quick Launch: desktop file ids, plus meadow:show-desktop. Missing apps are skipped.
quickLaunch=meadow:show-desktop, firefox.desktop, org.mozilla.firefox.desktop, pcmanfm-qt.desktop

[StartMenu]
# Pinned items until the user changes them: desktop file ids, or
# meadow:internet / meadow:email (the default web browser / mail client).
pinned=meadow:internet, meadow:email
# Shown in the frequently-used list until real usage fills it.
defaultFrequent=org.kde.kwrite.desktop, org.gnome.TextEditor.desktop, org.kde.kcalc.desktop, gnome-calculator.desktop, pcmanfm-qt.desktop, qterminal.desktop
# XDG menu file for All Programs; empty: meadow-applications.menu.
menuFile=
# Programs behind the right column. An item is hidden when its program is
# not installed. Commands are split like a shell would, but never run by one.
fileManager=pcmanfm-qt
controlPanel=meadow-control-panel
defaultPrograms=
printers=system-config-printer
help=yelp
search=pcmanfm-qt --find-files
