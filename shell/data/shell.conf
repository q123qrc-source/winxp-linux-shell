# Meadow shell defaults (/usr/share/meadow/shell.conf). Per-user changes go to
# ~/.config/meadow/shell.conf; this file is never written.
[Taskbar]
locked=true
autoHide=false
groupButtons=true
showQuickLaunch=true
showClock=true
hideInactiveIcons=true
# Quick Launch: desktop file ids, plus meadow:show-desktop. Missing apps are skipped.
quickLaunch=meadow:show-desktop, firefox.desktop, org.mozilla.firefox.desktop, pcmanfm-qt.desktop
