# Meadow Welcome screen settings. To change them, create theme.conf.user next
# to this file with the keys you want to override; SDDM reads it on top of
# this one, and package updates leave it alone.
[General]
# Color scheme: luna-blue, luna-olive or luna-silver (any scheme installed in
# /usr/share/meadow/themes works).
scheme=luna-blue
# "auto" follows the screen's logical DPI (1, 1.25, 1.5 or 2); or a number.
scale=auto
# Background: "welcome" (gradient layout), "solid", or an absolute image path.
background=welcome
showSessionSwitcher=true
showKeyboardLayout=true
# Start fingerprint authentication automatically when the selected user has
# enrolled fingers (phase 4, see docs/PAM_FINGERPRINT.md).
fingerprintAutoStart=true
# Start in high-contrast mode (it can also be toggled from the bottom band).
highContrast=false
# Show every power button even when SDDM reports the action as unavailable.
# Only for `sddm-greeter-qt6 --test-mode`, where SDDM reports nothing.
debugPowerButtons=false
