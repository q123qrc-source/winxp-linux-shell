[General]
# Color scheme: luna-blue, luna-olive or luna-silver.
scheme=luna-blue
# Background: "welcome" (gradient layout), "solid", or a path to an image.
background=welcome
showSessionSwitcher=true
showKeyboardLayout=true
# Start fingerprint authentication automatically when the selected user has
# enrolled fingers (see docs/PAM_FINGERPRINT.md).
fingerprintAutoStart=true
highContrast=false
